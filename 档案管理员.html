<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公民和谐部</title>
<style>
  :root {
    --bg: #070707;
    --surface: #0b0b0b;
    --border: #191919;
    --border-faint: #111;
    --text: #a8a88e;
    --text-dim: #3e3e34;
    --text-bright: #c8c8a8;
    --text-sys: #3d5c3d;
    --text-warn: #7a3838;
    --text-faded: #555548;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', Courier, monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 3px,
      rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  #terminal {
    width: 100%;
    max-width: 660px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 28px 32px 24px;
    animation: ambient-flicker 20s infinite;
  }

  @keyframes ambient-flicker {
    0%,89%,100% { opacity: 1; }
    90%  { opacity: 0.97; }
    91%  { opacity: 1; }
    95%  { opacity: 0.94; }
    96%  { opacity: 1; }
  }

  #top-bar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 24px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border-faint);
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--text-dim);
  }

  #scene-label {
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--text-dim);
    margin-bottom: 22px;
    min-height: 13px;
  }

  #story-text {
    font-size: 13px;
    line-height: 2;
    color: var(--text);
    margin-bottom: 28px;
    min-height: 180px;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  #story-text.visible { opacity: 1; }

  #story-text .sys  { color: var(--text-sys); font-size: 11px; letter-spacing: 0.5px; }
  #story-text .warn { color: var(--text-warn); }
  #story-text .hi   { color: var(--text-bright); }
  #story-text .dim  { color: var(--text-faded); }

  #story-text .redacted {
    background: #181818;
    color: #181818;
    cursor: default;
    padding: 0 3px;
    transition: color 0.4s;
    user-select: none;
  }
  #story-text .redacted:hover { color: #4a4a3e; }

  .file-box {
    border: 1px solid #161616;
    background: #090909;
    padding: 13px 15px;
    margin: 14px 0;
    font-size: 11.5px;
  }

  .file-hdr {
    color: var(--text-dim);
    font-size: 9px;
    letter-spacing: 2px;
    margin-bottom: 9px;
    padding-bottom: 7px;
    border-bottom: 1px solid #131313;
  }

  .file-row {
    display: flex;
    gap: 8px;
    margin-bottom: 5px;
    color: #686858;
    line-height: 1.7;
  }

  .fl { color: var(--text-dim); width: 110px; flex-shrink: 0; font-size: 10px; letter-spacing: 1px; }
  .fv { font-size: 11px; }

  #choices {
    display: flex;
    flex-direction: column;
    gap: 7px;
    opacity: 0;
    transition: opacity 0.4s ease 0.3s;
  }

  #choices.visible { opacity: 1; }

  .choice-btn {
    background: none;
    border: 1px solid #171717;
    color: #4e4e42;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.5px;
    padding: 10px 13px;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .choice-btn::before {
    content: '›';
    color: #252520;
    font-size: 14px;
    line-height: 1;
    transition: color 0.15s;
    flex-shrink: 0;
  }

  .choice-btn:hover {
    border-color: #2e2e2e;
    color: #888878;
    background: #0e0e0e;
  }

  .choice-btn:hover::before { color: #444438; }

  .choice-btn.danger:hover {
    border-color: #3a1818;
    color: #8a4444;
    background: #0d0909;
  }
  .choice-btn.danger:hover::before { color: #5a2828; }

  .choice-btn.sys-btn {
    border-color: #151e15;
    color: #3a5a3a;
  }
  .choice-btn.sys-btn:hover {
    border-color: #243824;
    color: #5a8a5a;
    background: #09100a;
  }

  #status-bar {
    margin-top: 22px;
    padding-top: 13px;
    border-top: 1px solid var(--border-faint);
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    letter-spacing: 2px;
    color: #222220;
  }

  .cursor {
    display: inline-block;
    width: 6px;
    height: 12px;
    background: #333;
    margin-left: 1px;
    vertical-align: middle;
    animation: blink 1.1s step-end infinite;
  }

  @keyframes blink {
    0%,100% { opacity: 1; }
    50%      { opacity: 0; }
  }

  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 500;
    align-items: center;
    justify-content: center;
  }

  #overlay.on { display: flex; }

  #overlay-msg {
    font-size: 9px;
    letter-spacing: 5px;
    color: #1e1e1a;
    animation: fade-pulse 1.4s ease infinite;
  }

  @keyframes fade-pulse {
    0%,100% { opacity: 0.4; }
    50%      { opacity: 1; }
  }
</style>
</head>

// ── 引擎 ──────────────────────────────────────────────────────────────────
function updateCompliance() {
  const el = document.getElementById('compliance');
  const c = S.compliance;
  if      (c >= 3)  el.innerHTML = '合规指数：最优';
  else if (c >= 1)  el.innerHTML = '合规指数：良好';
  else if (c === 0) el.innerHTML = '合规指数：计算中';
  else if (c >= -2) el.innerHTML = '合规指数：异常';
  else              el.innerHTML = '合规指数：<span class="warn">已标记</span>';
}

function transition(msg) {
  return new Promise(resolve => {
    const ov = document.getElementById('overlay');
    document.getElementById('overlay-msg').textContent = msg;
    ov.classList.add('on');
    setTimeout(() => { ov.classList.remove('on'); resolve(); }, 900);
  });
}

async function goTo(id) {
  const scene = SCENES[id];
  if (!scene) return;
  S.scene = id;

  await transition('处理中');

  const labelEl  = document.getElementById('scene-label');
  const textEl   = document.getElementById('story-text');
  const choiceEl = document.getElementById('choices');

  labelEl.textContent = scene.label;
  textEl.classList.remove('visible');
  choiceEl.classList.remove('visible');

  setTimeout(() => {
    textEl.innerHTML = scene.html;
    choiceEl.innerHTML = '';

    scene.choices.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn' + (c.cls ? ' ' + c.cls : '');
      btn.textContent = c.text;
      btn.addEventListener('click', () => {
        if (typeof c.compliance === 'number') {
          S.compliance += c.compliance;
          updateCompliance();
        }
        if (c.flag) S.flags.add(c.flag);
        goTo(c.next);
      });
      choiceEl.appendChild(btn);
    });

    requestAnimationFrame(() => {
      textEl.classList.add('visible');
      choiceEl.classList.add('visible');
    });
  }, 100);
}

goTo('boot');
</script>
